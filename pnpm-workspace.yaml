packages:
  - .

enableGlobalVirtualStore: false

allowBuilds:
  core-js: true
  esbuild: true
  rclone.js: false
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260911.1-alpha || 5.20260923.0-alpha
  - wrangler@4.131.2 || 4.139.0
  - '@cloudflare/vite-plugin@1.60.0'
  - vite@8.3.1
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
