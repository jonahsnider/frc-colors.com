name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_CONVEX_SITE_URL: https://example.convex.site

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - name: Check formatting, lint, and types
        run: vp check
      - name: Check Convex types
        run: vp exec tsc -p convex/tsconfig.json
      - name: Run Knip
        run: vp exec knip
      - name: Build
        run: vp build
