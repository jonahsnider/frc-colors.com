name: autofix.ci # needed to securely identify the workflow

on: [push, pull_request]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
      - name: Pull environment variables
        run: pnpm exec vercel env pull --environment development .env --token ${{ secrets.VERCEL_TOKEN }}
      - name: Migrate Biome schema
        continue-on-error: true
        run: pnpm exec biome migrate --write
      - name: Fix linting errors
        continue-on-error: true
        run: pnpm run lint:fix
      - name: Format with Prettier
        continue-on-error: true
        run: pnpm run format:write
      - name: Fix Knip issues
        continue-on-error: true
        run: pnpm exec knip --fix
        env:
          DATABASE_URL: unused
      - name: Run autofix.ci
        uses: autofix-ci/action@v1
        with:
          commit-message: 'refactor: apply automatic fixes'
